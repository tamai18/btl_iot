# ============================================================================
#  Mosquitto MQTT Broker – Cấu hình cho hệ thống ao nuôi
#  Lưu file này vào: C:\Program Files\mosquitto\mosquitto.conf
#  Khởi động: mosquitto -c mosquitto.conf -v
# ============================================================================

# Lắng nghe cổng 1883 (tất cả network interface)
listener 1883 0.0.0.0

# Cho phép kết nối ẩn danh (đặt false khi dùng password)
allow_anonymous false

# File mật khẩu (tạo bằng: mosquitto_passwd -c passwd.txt esp32)
password_file C:\Program Files\mosquitto\passwd.txt

# Giữ tin nhắn retained khi broker khởi động lại
persistence true
persistence_location C:\Program Files\mosquitto\data\

# Nhật ký
log_dest file C:\Program Files\mosquitto\log\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Giới hạn kích thước gói tin (phù hợp JSON từ ESP32)
message_size_limit 65536

# Keepalive tối đa
max_keepalive 300

# Số kết nối tối đa
max_connections 50
